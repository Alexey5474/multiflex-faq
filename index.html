function renderDetail(){if(!current||!canView(current)){navigateDesk();return}const r=current;document.getElementById('main').innerHTML='<div class="heading"><div class="detailtitle"><h1>'+esc(r.title)+'</h1><p class="sub">'+esc(r.id)+' · '+date(r.created)+' · '+esc(r.company)+'</p></div></div><div class="actions detail-actions">'+backButton()+'<button onclick="startEdit()" '+(editing||!can('edit')?'disabled':'')+'>Редактировать</button>'+(editing?'<button class="primary" type="submit" form="editform">Сохранить изменения</button><button onclick="cancelEdit()">Отмена</button>':'')+'</div><section class="panel detailmain"><div class="paneltitle"><h2>Карточка заявки</h2>'+badge(r.status)+'</div><div style="padding:0 22px"><div class="tabs">'+[['data','Исходные данные'],['files','Файлы'],['discussion','Обсуждение'],['history','История']].map(([t,n])=>'<button '+(editing?'disabled':'')+' class="'+(tab===t?'active':'')+'" onclick="tab=\''+t+'\';renderDetail()">'+n+'</button>').join('')+'</div><div id="tabbody" style="padding-bottom:22px"></div></div></section><div class="detailbottom"><section class="panel"><div class="paneltitle"><h2>Выполнение</h2></div>'+executionForm(r)+'</section><section class="panel"><div class="paneltitle"><h2>Заказчик</h2></div><div class="pad grid2">'+dataField('Организация',r.company)+dataField('Автор',r.author)+dataField('Последнее изменение по заявке',r.updatedAt||date(r.updated))+'</div></section></div>';renderTab()}
function executionForm(r){const allowed=rights[user().role].statuses;return '<form id="execform" class="pad grid2" oninput="updateExecutionDirty(this)" onchange="updateExecutionDirty(this)" onsubmit="saveExecution(event)"><div class="field"><label for="exec_status">Статус заявки</label><select id="exec_status" name="status" '+(editing?'disabled':'')+'>'+statuses.filter(s=>allowed.includes(s)||s===r.status).map(s=>'<option '+(s===r.status?'selected':'')+' '+(!allowed.includes(s)?'disabled':'')+'>'+esc(s)+'</option>').join('')+'</select></div><div class="field"><label for="exec_engineer">Ответственный инженер</label>'+(can('assign')?'<select id="exec_engineer" name="engineer" '+(editing?'disabled':'')+'>'+['Не назначен',...db.users.filter(u=>u.role==='engineer').map(u=>u.name),...(!db.users.some(u=>u.name===r.engineer)&&r.engineer!=='Не назначен'?[r.engineer]:[])].map(s=>option(s,r.engineer)).join('')+'</select>':'<div class="value">'+esc(r.engineer||'Не назначен')+'</div>')+'</div><div class="field actual-field"><label for="exec_actual">Фактический объём лесов, м³</label>'+(can('uploadResult')?'<input type="number" step="any" min="0" id="exec_actual" name="actualVolume" value="'+esc(r.actualVolume??'')+'" '+(editing?'disabled':'')+'>':'<div class="value">'+amount(r.actualVolume)+'</div>')+'</div><div class="executionfooter"><button id="exec_cancel" type="button" disabled onclick="renderExecution()">Отмена</button><button id="exec_save" class="primary" type="submit" disabled>Сохранить</button></div></form>'}
function renderExecution(){document.getElementById('execform').outerHTML=executionForm(current)}
function executionIsDirty(form){if(editing||!current)return false;const d=Object.fromEntries(new FormData(form));if(d.status&&d.status!==current.status)return true;if(can('assign')&&d.engineer!==undefined&&d.engineer!==current.engineer)return true;if(can('uploadResult')){if(form.elements?.actualVolume?.validity?.badInput)return true;try{if(parseAmount(d.actualVolume)!==current.actualVolume)return true}catch{return true}}return false}
function updateExecutionDirty(form){const dirty=executionIsDirty(form);document.getElementById('exec_save').disabled=!dirty;document.getElementById('exec_cancel').disabled=!dirty}
function saveExecution(e){e.preventDefault();if(editing||!current||!canView(current))return;const d=Object.fromEntries(new FormData(e.target));const nextStatus=d.status||current.status;if(nextStatus!==current.status&&!rights[user().role].statuses.includes(nextStatus)){toast('Этот статус недоступен для вашей роли');return}let nextActual=current.actualVolume;try{if(can('uploadResult'))nextActual=parseAmount(d.actualVolume)}catch(err){toast(err.message);return}if(['На проверке','Готово'].includes(nextStatus)&&nextStatus!==current.status&&!(nextActual>0)){toast('Перед сдачей укажите фактический объём лесов больше нуля');return}const changes={};if(nextStatus!==current.status)changes.status=nextStatus;if(can('assign')&&d.engineer!==current.engineer){const names=['Не назначен',...db.users.filter(u=>u.role==='engineer').map(u=>u.name)];if(!names.includes(d.engineer)){toast('Выберите инженера из справочника');return}changes.engineer=d.engineer}if(can('uploadResult')&&nextActual!==current.actualVolume)changes.actualVolume=nextActual;const labels={status:'Статус',engineer:'Ответственный инженер',actualVolume:'Фактический объём лесов'};if(!Object.keys(changes).length){toast('Изменений нет');return}if(transaction(()=>{for(const [key,value] of Object.entries(changes)){const old=current[key];current[key]=value;touch(current,labels[key]+': '+(old??'не задан')+' → '+(value??'не задан'))}})){renderDetail();toast('Выполнение сохранено')}}
function renderTab(){const r=current,b=document.getElementById('tabbody');if(editing){b.innerHTML='<form id="editform" onsubmit="saveEdit(event)">'+formFields(r)+'</form>';return}if(tab==='data'){b.innerHTML='<div class="grid2">'+dataField('Объект',r.object)+dataField('Установка',r.unit)+dataField('Сооружение',r.location)+dataField('Высотные отметки, м',r.level)+dataField('Тип лесов',r.type)+dataField('Прогнозируемый объём лесов, м³',r.volume??'—')+deadlineReadOnly(r)+dataField('Срочность',r.priority)+'<div class="field full"><label>Подробное описание</label><div class="value" style="white-space:pre-wrap">'+esc(r.description||'—')+'</div></div></div>';const object=db.objects.find(o=>o.id===r.objectId);if(object?.files?.length)b.innerHTML+='<h3 class="source-heading">Исходные данные объекта</h3>'+object.files.map(f=>fileHTML(f,'object',object.id)).join('')}
if(tab==='files')b.innerHTML=['input','result'].map((group,i)=>'<h3 style="margin-top:20px">'+(i?'Готовая документация':'Исходные данные заявки')+'</h3>'+r.files.filter(f=>f.group===group).map(f=>fileHTML(f,'request')).join('')+uploadWidget(group,'request')).join('');
if(tab==='discussion')b.innerHTML=(r.comments.length?r.comments.map(c=>'<div class="comment"><strong style="font-size:14px">'+esc(c.author)+'</strong><small style="float:right">'+esc(c.date)+'</small><p>'+esc(c.text)+'</p></div>').join(''):'<div class="empty">Комментариев пока нет</div>')+'<form class="composer" onsubmit="addComment(event)"><textarea name="comment" aria-label="Текст комментария" required placeholder="Комментарий по заявке"></textarea><div class="actions"><button class="primary">Добавить</button></div></form>';
if(tab==='history')b.innerHTML=r.audit.map(a=>'<div class="audit">'+esc(a.text)+'<small>'+esc(a.date)+' · '+esc(a.author)+'</small></div>').join('')}
function addComment(e){e.preventDefault();if(!current||!canView(current))return;const text=new FormData(e.target).get('comment').trim();if(!text)return;if(transaction(()=>{current.comments.push({id:uid(),author:user().name,date:stamp(),text});touch(current,'Добавлен комментарий')}))renderDetail()}
function modal(title,body,footer=''){const m=document.getElementById('modal');m.innerHTML='<div class="dialoghead"><h2>'+esc(title)+'</h2><button class="close" aria-label="Закрыть" onclick="closeModal()">×</button></div><div class="content">'+body+'</div><div class="dialogfoot">'+(footer||'<button onclick="closeModal()">Закрыть</button>')+'</div>';m.showModal()}
function closeModal(){document.getElementById('modal').close()}
function deadlineHint(type){const n=recommendedDays[type];return n?'Рекомендуемый срок: '+n+' '+(n===1?'день':n<5?'дня':'дней'):''}
function deadlineReadOnly(r){return '<div class="field"><label>Прогнозируемый срок сдачи</label><div class="value">'+date(r.due)+'</div><small class="deadlinehint">'+deadlineHint(r.type)+'</small></div>'}
function deadlineFields(r){return '<div class="field deadline-field"><label for="f_due">Прогнозируемый срок сдачи</label><input id="f_due" name="due" type="date" value="'+esc(r.due||'')+'"><small id="deadline_hint" class="deadlinehint">'+deadlineHint(r.type||systems[0])+'</small></div>'}
function updateDeadlineHint(form){document.getElementById('deadline_hint').textContent=deadlineHint(form.elements.type.value)}
function formFields(r={}){const objs=objectsForUser();const o=objs.find(o=>o.id===r.objectId)||objs.find(o=>o.name===r.object)||objs[0];const company=r.company||o?.company||user().company;const units=o?.units||[],un=units.find(u=>u.name===r.unit)||units[0];const companies=[...new Set(objs.map(o=>o.company))];const contacts=[...new Set([...db.users.filter(u=>u.role==='client'&&u.company===company).map(u=>u.name),...objs.filter(x=>x.company===company).map(x=>x.author)])];return '<div class="grid2 formgrid">'+inputField('title','Краткое описание заявки',r.title,'text',true)+selectField('company','Клиент / организация',companies,company,'onchange="changeFormCompany(this.form)"')+selectField('object','Объект',objs.filter(x=>x.company===company).map(x=>x.name),r.object||o?.name,'onchange="changeFormObject(this.form)"')+selectField('unit','Установка',units.map(x=>x.name),r.unit||un?.name,'onchange="changeFormUnit(this.form)"')+selectField('location','Сооружение',un?.structures||[],r.location)+inputField('level','Высотные отметки, м',r.level)+selectField('type','Тип лесов',systems,r.type,'onchange="updateDeadlineHint(this.form)"')+inputField('volume','Прогнозируемый объём лесов, м³',r.volume,'number')+selectField('author','Автор со стороны заказчика',contacts,r.author)+deadlineFields(r)+selectField('priority','Срочность',['Обычная','Высокая'],r.priority)+'<div class="field full"><label for="f_description">Подробное описание</label><textarea id="f_description" name="description">'+esc(r.description||'')+'</textarea></div></div>'}
function setChoices(form,name,values,value){form.elements[name].innerHTML=values.map(x=>option(x,value)).join('')}
function changeFormCompany(form){const c=form.elements.company.value;setChoices(form,'object',objectsForUser().filter(o=>o.company===c).map(o=>o.name));setChoices(form,'author',[...new Set([...db.users.filter(u=>u.role==='client'&&u.company===c).map(u=>u.name),...db.objects.filter(o=>o.company===c).map(o=>o.author)])]);changeFormObject(form)}
function changeFormObject(form){const o=objectsForUser().find(o=>o.name===form.elements.object.value&&o.company===form.elements.company.value);setChoices(form,'unit',(o?.units||[]).map(u=>u.name));changeFormUnit(form)}
function changeFormUnit(form){const o=objectsForUser().find(o=>o.name===form.elements.object.value&&o.company===form.elements.company.value),u=o?.units.find(u=>u.name===form.elements.unit.value);setChoices(form,'location',u?.structures||[])}
function readRequestForm(form){const d=Object.fromEntries(new FormData(form));d.title=d.title?.trim();d.description=d.description?.trim()||'';if(!d.title)throw Error('Заполните краткое описание заявки');if(d.title.length>100)throw Error('Краткое описание заявки — не более 100 символов');d.volume=parseAmount(d.volume);const o=objectsForUser().find(o=>o.name===d.object&&o.company===d.company);if(!o)throw Error('Выберите объект из справочника');const u=o.units.find(u=>u.name===d.unit);if(!u||!u.structures.includes(d.location))throw Error('Выберите установку и сооружение');if(user().role==='client'&&(d.company!==user().company||d.author!==user().name))throw Error('Клиент может создать заявку только от своего имени');if(!systems.includes(d.type)||!['Обычная','Высокая'].includes(d.priority))throw Error('Проверьте исходные данные');d.objectId=o.id;d.due=d.due||'';if(d.due){const parsed=new Date(d.due+'T00:00:00Z');if(!/^\d{4}-\d{2}-\d{2}$/.test(d.due)||!Number.isFinite(parsed.getTime())||parsed.toISOString().slice(0,10)!==d.due)throw Error('Выберите корректную дату сдачи')}return d}
function startCreate(){if(!guard('create'))return;if(!objectsForUser().length){toast('Исходные данные объекта ещё не добавлены в справочник');return}screen='new';draftFiles=[];editing=false;render();window.scrollTo(0,0)}
function renderForm(){if(!can('create')){navigateDesk();return}document.getElementById('main').innerHTML=backButton()+'<div class="heading"><h1>Создание заявки</h1></div><section class="panel create-card"><form class="pad" id="newform" onsubmit="createRequest(event)">'+formFields()+draftUploads()+'<div class="formactions"><button type="button" onclick="navigateDesk()">Отмена</button><button type="submit" class="primary" id="createbtn">Создать заявку</button></div></form></section>';renderDraftFiles()}
function createRequest(e){e.preventDefault();if(busy||!guard('create'))return;let d;try{d=readRequestForm(e.target)}catch(err){toast(err.message);return}const pending=document.getElementById('newlink')?.value.trim();if(pending){if(!addDraftURL(pending))return}const year=today().slice(0,4),n=Math.max(0,...requests.filter(r=>r.id.startsWith('SD-'+year+'-')).map(r=>Number(r.id.split('-')[2])||0))+1,id='SD-'+year+'-'+String(n).padStart(4,'0');if(transaction(()=>{const r={...d,id,created:today(),updated:today(),createdBy:user().name,engineer:'Не назначен',status:'Новая',actualVolume:null,comments:[],files:structuredClone(draftFiles),audit:[]};touch(r,'Заявка зарегистрирована от имени '+d.author+' · '+d.company);requests.unshift(r)})){draftFiles=[];openRequest(id);toast('Заявка создана')}}
function startEdit(){if(!guard('edit'))return;editing=true;tab='data';renderDetail()}
function cancelEdit(){editing=false;renderDetail()}
function saveEdit(e){e.preventDefault();if(!guard('edit'))return;let d;try{d=readRequestForm(e.target)}catch(err){toast(err.message);return}const labels={title:'Краткое описание',description:'Подробное описание',volume:'Прогнозируемый объём',company:'Клиент',author:'Автор',object:'Объект',unit:'Установка',location:'Сооружение',level:'Отметки',type:'Тип лесов',due:'Прогнозируемый срок сдачи',priority:'Срочность'};const changed=Object.keys(labels).filter(k=>String(current[k]??'')!==String(d[k]??''));if(!changed.length){editing=false;renderDetail();toast('Изменений нет');return}if(transaction(()=>{for(const k of changed){const old=current[k];current[k]=d[k];touch(current,labels[k]+': '+(old??'не задан')+' → '+(d[k]??'не задан'))}current.objectId=d.objectId})){editing=false;renderDetail();toast('Изменения сохранены')}}
function validLink(s){try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}}
function fileHTML(f,scope,objectId=''){return '<div class="rowfile">'+icon('file')+'<span>'+esc(f.name)+(f.url?'<small style="display:block;color:var(--muted);overflow-wrap:anywhere">'+esc(f.url)+'</small>':'<small style="display:block;color:var(--muted)">'+Math.ceil(f.size/1024)+' КБ</small>')+'<small style="display:block;color:var(--muted)">'+esc(f.author||'')+' · '+esc(f.date||'')+'</small></span>'+(f.url?'<a href="'+esc(f.url)+'" target="_blank" rel="noopener noreferrer">Открыть</a>':'<button onclick="downloadFile(\''+esc(f.id)+'\',\''+scope+'\',\''+esc(objectId)+'\')">Скачать</button>')+'</div>'}
function fileAllowed(group,scope){return scope==='object'?false:can(group==='input'?'uploadInput':'uploadResult')}
function uploadWidget(group,scope,objectId=''){if(!fileAllowed(group,scope))return '';return '<div class="filechoice"><label class="uploadlabel">Прикрепить файлы<input type="file" multiple onchange="attachFiles(this,\''+group+'\',\''+scope+'\',\''+objectId+'\')"></label></div><form class="uploadline" onsubmit="addLink(event,\''+group+'\',\''+scope+'\',\''+objectId+'\')"><input type="url" name="url" required placeholder="https://..." aria-label="'+(scope==='object'?'Ссылка на исходные данные объекта':group==='input'?'Ссылка на исходные файлы':'Ссылка на результат')+'"><button>Добавить ссылку</button></form>'}
async function readFiles(input){const result=[];for(const f of input.files){if(f.size>2*1024*1024)throw Error('Размер файла в локальном HTML — до 2 МБ');const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('Не удалось прочитать файл'));reader.readAsDataURL(f)});result.push({id:uid(),name:f.name,size:f.size,data,date:stamp(),author:user().name})}input.value='';return result}
async function attachFiles(input,group,scope,objectId){if(!fileAllowed(group,scope)){toast('Загрузка недоступна для вашей роли');return}const target=scope==='object'?db.objects.find(o=>o.id===objectId):current;const active=db.activeUserId;if(!target)return;try{const files=await readFiles(input);if(!files.length)return;if(active!==db.activeUserId||!fileAllowed(group,scope))return;if(transaction(()=>{target.files??=[];target.files.push(...files.map(f=>({...f,group})));if(scope==='request')touch(target,'Загружены '+(group==='input'?'исходные файлы':'результаты')+': '+files.map(f=>f.name).join(', '))})){if(scope==='request')renderDetail();else objectFilesDialog(objectId);toast('Файлы сохранены')}}catch(err){toast(err.message)}}
function addLink(e,group,scope,objectId){e.preventDefault();if(!fileAllowed(group,scope)){toast('Добавление недоступно для вашей роли');return}const url=validLink(new FormData(e.target).get('url'));if(!url){toast('Укажите ссылку http:// или https://');return}const target=scope==='object'?db.objects.find(o=>o.id===objectId):current;if(!target)return;if(transaction(()=>{target.files??=[];target.files.push({id:uid(),name:'Ссылка на файлы',url,group,date:stamp(),author:user().name});if(scope==='request')touch(target,'Добавлена ссылка: '+url)})){if(scope==='request')renderDetail();else objectFilesDialog(objectId)}}
function downloadFile(id,scope,objectId){const files=scope==='object'?db.objects.find(o=>o.id===objectId)?.files:current?.files;const f=files?.find(f=>f.id===id);if(!f?.data)return;const a=document.createElement('a');a.href=f.data;a.download=f.name;a.click()}
function draftUploads(){return '<div class="field"><label>Исходные файлы</label><button type="button" disabled>Прикрепить файлы</button><div id="draftfiles" class="filelist"></div></div><div class="field" style="margin-top:18px"><label for="newlink">Ссылки на файлы</label><div class="uploadline"><input id="newlink" type="url" placeholder="https://..." disabled><button type="button" disabled>Добавить ссылку</button></div><div id="draftlinks" class="filelist"></div></div>'}
function renderDraftFiles(){for(const [id,link] of [['draftfiles',false],['draftlinks',true]])document.getElementById(id).innerHTML=draftFiles.filter(f=>!!f.url===link).map(f=>'<div class="rowfile"><span>'+esc(f.url||f.name)+'</span><button type="button" onclick="removeDraft(\''+f.id+'\')">Удалить</button></div>').join('')}
function removeDraft(id){draftFiles=draftFiles.filter(f=>f.id!==id);renderDraftFiles()}
async function addDraftFiles(){return false}
function addDraftURL(){return false}
function addDraftLink(){return false}
persist();render();
</script></body></html>
