function navigateDesk(){editing=false;screen='desk';current=null;render();window.scrollTo(0,0)}function render(){renderNav();if(screen==='desk')renderDesk();else if(screen==='detail')renderDetail();else renderForm()}
function filtered(){return requests.filter(r=>(!q||(r.id+' '+r.title+' '+r.description).toLocaleLowerCase('ru').includes(q.toLocaleLowerCase('ru')))&&(!of||r.object===of)&&(!ef||r.engineer===ef)&&(!sf||r.status===sf)&&(!from||r.created>=from)&&(!to||r.created<=to)).sort((a,b)=>sortAsc?a.id.localeCompare(b.id):b.id.localeCompare(a.id))}
function renderDesk(){document.getElementById('main').innerHTML='<div class="heading"><h1>Стол заявок</h1></div><div class="actions desk-actions"><button class="primary" onclick="screen=\'new\';draftFiles=[];render();window.scrollTo(0,0)">'+icon('plus')+'Создать заявку</button><button disabled>'+icon('export')+'Выгрузить</button></div><div class="stats">'+statuses.map((s,i)=>'<button class="stat '+(sf===s?'on':'')+'" onclick="sf=sf===statuses['+i+']?\'\':statuses['+i+'];page=1;renderDesk()"><label>'+statusLabels[i]+'<span class="dot '+classes[i]+'"></span></label><strong>'+requests.filter(r=>r.status===s).length+'</strong></button>').join('')+'</div><section class="panel"><div class="toolbar"><div class="search">'+icon('search')+'<input aria-label="Поиск заявок" placeholder="Поиск по номеру, названию или описанию" value="'+esc(q)+'" oninput="q=this.value;page=1;renderRows()"></div><select aria-label="Объект" onchange="of=this.value;page=1;renderRows()"><option value="">Все объекты</option>'+[...new Set([project,...requests.map(r=>r.object)])].map(x=>option(x,of)).join('')+'</select><select aria-label="Инженер" onchange="ef=this.value;page=1;renderRows()"><option value="">Все инженеры</option>'+engineers.map(x=>option(x,ef)).join('')+'</select><select aria-label="Статус" onchange="sf=this.value;page=1;renderDesk()"><option value="">Все статусы</option>'+statuses.map(x=>option(x,sf)).join('')+'</select></div><div class="filters"><label>Дата заявки с <input type="date" aria-label="Дата заявки с" value="'+from+'" style="width:155px;padding:6px" onchange="from=this.value;page=1;renderRows()"></label><label>по <input type="date" aria-label="Дата заявки по" value="'+to+'" style="width:155px;padding:6px" onchange="to=this.value;page=1;renderRows()"></label><button onclick="resetFilters()">Сбросить</button></div><div class="tablewrap"><table><thead><tr><th><button class="linkbtn" onclick="sortAsc=!sortAsc;renderRows()">Номер и дата</button></th><th>Объект и расположение</th><th>Содержание заявки</th><th>Тип и объём лесов</th><th>Статус</th></tr></thead><tbody id="rows"></tbody></table></div><div class="tablefoot" id="tablefoot"></div></section>';renderRows()}
function renderRows(){const list=filtered();page=Math.min(page,Math.max(1,Math.ceil(list.length/10)));document.getElementById('rows').innerHTML=list.slice((page-1)*10,page*10).map(r=>'<tr tabindex="0" aria-label="Открыть заявку '+r.id+'" onclick="openRequest(\''+r.id+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openRequest(\''+r.id+'\')}"><td><span class="request-number">'+r.id+'</span><small>'+date(r.created)+'</small></td><td><strong>'+esc(r.object)+'</strong><small>'+esc(r.unit)+'</small><small>'+esc(r.location)+'</small></td><td><div class="subject">'+esc(r.title)+'</div></td><td>'+esc(r.type)+'<small>'+(r.volume==null?'—':Number(r.volume).toLocaleString('ru-RU')+' м³')+'</small></td><td>'+badge(r.status)+(r.priority==='Высокая'?'<span class="priority">Высокая срочность</span>':'')+'</td></tr>').join('')||'<tr><td colspan="5"><div class="empty">Заявки не найдены</div></td></tr>';document.getElementById('tablefoot').innerHTML='<span>Заявок: '+list.length+'</span>'+(list.length>10?'<div class="actions"><button '+(page<=1?'disabled':'')+' onclick="page--;renderRows()">Назад</button><span>'+page+' / '+Math.ceil(list.length/10)+'</span><button '+(page*10>=list.length?'disabled':'')+' onclick="page++;renderRows()">Далее</button></div>':'')}
function resetFilters(){q=of=ef=sf=from=to='';page=1;renderDesk()}
function openRequest(id){editing=false;current=requests.find(r=>r.id===id);screen='detail';tab='data';render();window.scrollTo(0,0)}
function changeRecord(key,val){if(current[key]===val)return;const old=current[key];current[key]=val;if(key==='status')current.acceptance=val==='Готово'?'Ожидает приёмки':'Не передано';current.updated=today();current.audit.unshift({text:({status:'Статус',engineer:'Инженер',due:'Плановый срок',priority:'Срочность'}[key]||key)+': '+(old||'не задан')+' → '+(val||'не задан'),date:stamp(),author:me});save();renderDetail()}
function dataField(l,v){return '<div class="field"><label>'+l+'</label><div class="value">'+esc(v||'—')+'</div></div>'}
function renderDetail(){let r=current;document.getElementById('main').innerHTML='<div class="heading"><div class="detailtitle"><h1>'+esc(r.title)+'</h1><p class="sub">'+r.id+' · '+date(r.created)+' · '+esc(r.company)+'</p></div></div><div class="actions"><button onclick="startEdit()" '+(editing?'disabled':'')+'>Редактировать</button>'+(editing?'<button class="primary" type="submit" form="editform">Сохранить изменения</button><button onclick="cancelEdit()">Отмена</button>':'')+'</div><section class="panel detailmain"><div class="paneltitle"><h2>Карточка заявки</h2>'+badge(r.status)+'</div><div style="padding:0 22px"><div class="tabs">'+[['data','Исходные данные'],['files','Файлы'],['discussion','Обсуждение'],['history','История']].map(([t,n])=>'<button '+(editing?'disabled':'')+' class="'+(tab===t?'active':'')+'" onclick="tab=\''+t+'\';renderDetail()">'+n+'</button>').join('')+'</div><div id="tabbody" style="padding-bottom:22px"></div></div></section><div class="detailbottom"><section class="panel"><div class="paneltitle"><h2>Выполнение</h2></div><div class="pad grid2"><div class="field"><label for="rstatus">Статус заявки</label><select id="rstatus" '+(editing?'disabled':'')+' onchange="changeRecord(\'status\',this.value)">'+statuses.map(x=>option(x,r.status)).join('')+'</select></div><div class="field"><label for="rengineer">Ответственный инженер</label><select id="rengineer" '+(editing?'disabled':'')+' onchange="changeRecord(\'engineer\',this.value)">'+engineers.map(x=>option(x,r.engineer)).join('')+'</select></div><div class="field"><label for="rdue">Плановый срок</label><input id="rdue" '+(editing?'disabled':'')+' type="date" value="'+esc(r.due)+'" onchange="changeRecord(\'due\',this.value)"></div><div class="field"><label for="rpriority">Срочность</label><select id="rpriority" '+(editing?'disabled':'')+' onchange="changeRecord(\'priority\',this.value)">'+['Обычная','Высокая'].map(x=>option(x,r.priority)).join('')+'</select></div></div></section><section class="panel"><div class="paneltitle"><h2>Заказчик</h2></div><div class="pad grid2">'+dataField('Организация',r.company)+dataField('Автор',r.author)+dataField('Последнее изменение по заявке',date(r.updated))+'</div></section></div>';renderTab()}
function renderTab(){const r=current,b=document.getElementById('tabbody');if(editing){b.innerHTML='<form id="editform" onsubmit="saveEdit(event)">'+formFields(current)+'</form>';return;}if(tab==='data')b.innerHTML='<div class="grid2">'+dataField('Объект',r.object)+dataField('Установка',r.unit)+dataField('Сооружение',r.location)+dataField('Высотные отметки, м',r.level)+dataField('Тип лесов',r.type)+dataField('Объём лесов, м³',r.volume==null?'—':Number(r.volume).toLocaleString('ru-RU'))+'<div class="field full"><label>Описание</label><div class="value" style="white-space:pre-wrap">'+esc(r.description)+'</div></div></div>';
if(tab==='files')b.innerHTML=['input','result'].map((group,i)=>'<h3 style="margin-top:20px">'+(i?'Готовая документация':'Исходные данные')+'</h3>'+r.files.filter(f=>f.group===group).map(f=>fileHTML(f,true)).join('')+'<div class="filechoice"><button type="button" disabled>Прикрепить файлы</button></div><form class="uploadline" onsubmit="addRequestLink(event,\''+group+'\')"><input type="url" name="url" required placeholder="https://..." aria-label="'+(i?'Ссылка на результат':'Ссылка на исходные файлы')+'"><button type="submit">Добавить ссылку</button></form>').join('');
if(tab==='discussion')b.innerHTML=(r.comments.length?r.comments.map(c=>'<div class="comment"><strong style="font-size:14px">'+esc(c.author)+'</strong>'+'<small style="float:right">'+esc(c.date)+'</small><p>'+esc(c.text)+'</p></div>').join(''):'<div class="empty">Комментариев пока нет</div>')+'<form class="composer" onsubmit="addComment(event)"><textarea id="commenttext" aria-label="Текст комментария" required placeholder="Комментарий по заявке"></textarea><div class="actions"><button class="primary" type="submit">Добавить</button></div></form>';
if(tab==='history')b.innerHTML=r.audit.map(a=>'<div class="audit">'+esc(a.text)+'<small>'+esc(a.date)+' · '+esc(a.author)+'</small></div>').join('')}
function addComment(e){e.preventDefault();const text=document.getElementById('commenttext').value.trim();if(!text)return;current.comments.push({author:me,date:stamp(),text});current.updated=today();current.audit.unshift({text:'Добавлен комментарий',date:stamp(),author:me});save();renderDetail()}
function modal(title,body,footer=''){const m=document.getElementById('modal');m.innerHTML='<div class="dialoghead"><h2>'+title+'</h2><button class="close" aria-label="Закрыть" onclick="closeModal()">×</button></div><div class="content">'+body+'</div><div class="dialogfoot">'+(footer||'<button onclick="closeModal()">Закрыть</button>')+'</div>';m.showModal()}function closeModal(){document.getElementById('modal').close()}
function inputField(k,l,v='',type='text',req=false){return '<div class="field"><label for="f_'+k+'">'+l+(req?' *':'')+'</label><input id="f_'+k+'" name="'+k+'" type="'+type+'" value="'+esc(v??'')+'" '+(req?'required':'')+(type==='number'?' min="0.01" step="0.01"':'')+'></div>'}
function selectField(k,l,values,v){return '<div class="field"><label for="f_'+k+'">'+l+'</label><select id="f_'+k+'" name="'+k+'">'+values.map(x=>option(x,v)).join('')+'</select></div>'}
function formFields(r={}){return '<div class="grid2 formgrid">'+inputField('title','Содержание заявки',r.title,'text',true)+selectField('company','Организация заказчика',[company],r.company)+selectField('object','Объект',[project],r.object)+selectField('unit','Установка',[unit],r.unit)+selectField('location','Сооружение',structures,r.location)+inputField('level','Высотные отметки, м',r.level)+selectField('type','Тип лесов',systems,r.type)+inputField('volume','Объём лесов, м³',r.volume,'number')+selectField('author','Автор со стороны заказчика',[contact],r.author)+inputField('due','Плановый срок',r.due,'date')+'<div class="field full"><label for="f_description">Описание *</label><textarea id="f_description" name="description" required>'+esc(r.description)+'</textarea></div></div>'}
function uploadFields(){return '<div class="field"><label>Файлы</label><div class="uploadline"><button type="button" disabled>Прикрепить файлы</button></div><div id="draftfiles" class="filelist"></div></div><div class="field" style="margin-top:18px"><label for="newlink">Ссылки на файлы</label><div class="uploadline"><input id="newlink" type="url" placeholder="https://..."><button type="button" onclick="addDraftLink()">Добавить ссылку</button></div><div id="draftlinks" class="filelist"></div></div>'}
function renderForm(){document.getElementById('main').innerHTML='<div class="heading"><h1>Создание заявки</h1></div><section class="panel create-card"><form class="pad" id="newform" onsubmit="createRequest(event)">'+formFields()+uploadFields()+'<div class="formactions"><button type="button" onclick="navigateDesk()">Отмена</button><button type="submit" class="primary" id="createbtn">Создать заявку</button></div></form></section>';renderDraftFiles()}
function validLink(s){try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}}
function fileHTML(f,download=false){return '<div class="rowfile">'+icon('file')+'<span>'+esc(f.name)+(f.url?'<small style="display:block;color:var(--muted);overflow-wrap:anywhere">'+esc(f.url)+'</small>':'<small style="display:block;color:var(--muted)">'+Math.ceil(f.size/1024)+' КБ</small>')+'</span>'+(download?(f.url?'<a href="'+esc(f.url)+'" target="_blank" rel="noopener noreferrer">Открыть</a>':'<button onclick="downloadFile(\''+f.id+'\')">Скачать</button>'):'<button type="button" aria-label="Удалить '+esc(f.name)+'" onclick="removeDraft(\''+f.id+'\')">×</button>')+'</div>'}
function renderDraftFiles(){document.getElementById('draftfiles').innerHTML=draftFiles.filter(f=>!f.url).map(f=>fileHTML(f)).join('');document.getElementById('draftlinks').innerHTML=draftFiles.filter(f=>f.url).map(f=>fileHTML(f)).join('')}
function removeDraft(id){draftFiles=draftFiles.filter(f=>f.id!==id);renderDraftFiles()}
function addDraftLink(){const e=document.getElementById('newlink');const url=validLink(e.value.trim());if(!url){toast('Укажите ссылку, начинающуюся с https:// или http://');return}draftFiles.push({id:crypto.randomUUID(),name:'Ссылка на файлы',url,group:'input',date:stamp()});e.value='';renderDraftFiles()}
async function readFiles(input){const files=[...input.files];const result=[];for(const f of files){if(f.size>2*1024*1024){toast('Для макета размер файла — до 2 МБ');continue}const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(f)});result.push({id:crypto.randomUUID(),name:f.name,size:f.size,data,date:stamp()})}input.value='';return result}
async function addDraftFiles(input){const btn=document.getElementById('createbtn');btn.disabled=true;try{draftFiles.push(...(await readFiles(input)).map(f=>({...f,group:'input'})));renderDraftFiles()}catch{toast('Не удалось прочитать файл')}finally{btn.disabled=false}}
async function attachToRequest(input,group){const target=current;try{const files=await readFiles(input);if(!files.length)return;target.files.push(...files.map(f=>({...f,group})));target.updated=today();target.audit.unshift({text:'Прикреплены файлы: '+files.map(f=>f.name).join(', '),date:stamp(),author:me});save();if(target===current)renderDetail()}catch{toast('Не удалось прочитать файл')}}
function addRequestLink(e,group){e.preventDefault();const url=validLink(new FormData(e.target).get('url'));if(!url){toast('Проверьте ссылку');return}current.files.push({id:crypto.randomUUID(),name:'Ссылка на файлы',url,group,date:stamp()});current.updated=today();current.audit.unshift({text:'Добавлена ссылка на файлы',date:stamp(),author:me});save();renderDetail()}
function downloadFile(id){const f=current.files.find(f=>f.id===id);const a=document.createElement('a');a.href=f.data;a.download=f.name;a.click()}
function createRequest(e){e.preventDefault();const obj=Object.fromEntries(new FormData(e.target));for(const k of ['title','description']){obj[k]=obj[k].trim();if(!obj[k]){toast('Заполните обязательные поля');return}}const pending=document.getElementById('newlink').value.trim();if(pending){const url=validLink(pending);if(!url){toast('Проверьте ссылку на файлы');return}draftFiles.push({id:crypto.randomUUID(),name:'Ссылка на файлы',url,group:'input',date:stamp()})}const year=today().slice(0,4);const num=Math.max(0,...requests.filter(r=>r.id.startsWith('SD-'+year+'-')).map(r=>Number(r.id.split('-')[2])))+1;const id='SD-'+year+'-'+String(num).padStart(4,'0');const r={...structuredClone(base),...obj,id,volume:obj.volume?Number(obj.volume):null,createdBy:me,created:today(),updated:today(),status:'Новая',files:structuredClone(draftFiles),audit:[{text:'Заявка зарегистрирована от имени '+obj.author+' · '+obj.company,date:stamp(),author:me}]};requests.unshift(r);save();draftFiles=[];openRequest(id)}
function startEdit(){editing=true;tab='data';renderDetail()}
function cancelEdit(){editing=false;renderDetail()}
function saveEdit(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));for(const k of ['title','description']){d[k]=d[k].trim();if(!d[k]){toast('Заполните обязательные поля');return}}d.volume=d.volume?Number(d.volume):null;const names={title:'Содержание заявки',company:'Организация',object:'Объект',unit:'Установка',location:'Сооружение',level:'Отметки',type:'Тип лесов',volume:'Объём',author:'Автор',due:'Плановый срок',description:'Описание'};const changed=Object.keys(d).filter(k=>String(current[k]??'')!==String(d[k]??''));if(changed.length){const before=structuredClone(current);Object.assign(current,d,{updated:today()});current.audit.unshift({text:'Изменены данные: '+changed.map(k=>names[k]).join(', '),date:stamp(),author:me});if(!save()){Object.assign(current,before);return}}editing=false;renderDetail();toast(changed.length?'Изменения сохранены':'Изменений нет')}
function exportDialog(){modal('Выгрузка заявок','<div class="field"><label for="exportscope">Заявки</label><select id="exportscope"><option value="filtered">С учётом фильтров</option><option value="all">Все заявки</option></select></div><div class="field" style="margin-top:18px"><label>Формат</label><div>CSV</div></div>','<button onclick="closeModal()">Отмена</button><button class="primary" onclick="exportCSV()">Скачать</button>')}
function csvValue(v){let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}
function exportCSV(){const list=document.getElementById('exportscope').value==='all'?requests:filtered();if(!list.length){toast('Нет заявок для выгрузки');return}const keys=['id','created','company','author','createdBy','object','unit','location','level','title','type','volume','priority','status','engineer','due','updated','description'];const labels=['Номер заявки','Дата заявки','Организация','Автор заказчика','Зарегистрировал','Объект','Установка','Сооружение','Отметка м','Содержание заявки','Тип лесов','Объём м3','Срочность','Статус','Инженер','Плановый срок','Дата изменения','Описание'];const data='\uFEFF'+[labels,...list.map(r=>keys.map(k=>r[k]))].map(row=>row.map(csvValue).join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='SiteDesk_'+today()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);closeModal()}
render();
</script></body></html>
